name: Android CI/CD

on:
  pull_request:
    branches: ["main", "release/*"]
  push:
    branches: ["main", "release/*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - beta
          - production
      run_ui_tests:
        description: "Run UI (Espresso) tests"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  quality:
    name: Quality / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Lint
        run: make lint

      - name: Verify Gradle wrapper
        run: |
          ls -l gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Smoke build
        run: ./gradlew assembleDebug

  tests:
    name: Unit + Integration + Coverage
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Verify Gradle wrapper
        run: |
          ls -l gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Coverage
        run: make coverage

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results
            app/build/reports/tests
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: app/build/reports/jacoco
          if-no-files-found: warn

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit & Integration Tests
          path: app/build/test-results/testDebugUnitTest/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true

  ui_tests:
    name: UI Tests (Espresso)
    runs-on: ubuntu-latest
    needs: [tests]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ui_tests == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
          yes | sdkmanager --licenses

      - name: Verify Gradle wrapper
        run: |
          ls -l gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: UI tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          cache: true
          script: make test-ui

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: warn

      - name: Publish instrumentation test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Instrumentation Tests
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          reporter: java-junit
          fail-on-error: false

  internal_deploy:
    name: Internal Artifact Deployment
    runs-on: ubuntu-latest
    needs: [ui_tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: internal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Verify Gradle wrapper
        run: |
          ls -l gradle/wrapper
          file gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Build versioned APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_NAME="$(./gradlew -q printVersionName -PciVersionSuffix="${SHORT_SHA}" | tail -n 1)"
          ./gradlew assembleDebug -PciVersionSuffix="${SHORT_SHA}"
          ARTIFACT_NAME="sleep8-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ARTIFACT_NAME}"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: Upload internal APK
        uses: actions/upload-artifact@v4
        with:
          name: internal-apk-${{ github.sha }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
